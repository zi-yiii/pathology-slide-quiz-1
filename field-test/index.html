<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿米巴 · 10×視野測試</title><style>body{background:#17171c;color:#eee;font:16px system-ui;margin:20px}h1{font-size:20px}.field{position:relative;width:min(85vw,78vh,900px);aspect-ratio:1;border-radius:50%;overflow:hidden;margin:18px auto;background:white}img{width:100%;display:block}.scale{position:absolute;bottom:12%;left:42%;width:5.556%;border-bottom:3px solid #111;color:#111;background:#ffffffc0;font-size:11px;white-space:nowrap}p{text-align:center}</style><h1>PA0206 · 圓形視野比較</h1><div style="text-align:center"><button onclick="setField(10)">10× 視野</button> <button onclick="setField(40)">40× 視野</button></div><p id="description">直徑1.8mm，依目鏡FN18模擬；圖片解析度約0.907µm/px。未加箭頭，請自行找滋養體。</p><div class="field"><img id="field-image" src="field40.jpg" alt="阿米巴感染，圓形視野直徑1.8mm"><div class="scale" id="scale">100 µm</div></div><p>這是固定位置測試，不是光學倍率校準；請用你平常的螢幕大小判斷。</p></html><script>function setField(n){document.getElementById('field-image').src=n===40?'field40.jpg':'field10.jpg';document.getElementById('description').textContent='直徑'+(n===40?'0.45':'1.8')+'mm，依目鏡FN18模擬；同一中心、同一圖片解析度，沒有新增原圖細節。';document.getElementById('scale').style.width=(n===40?22.222:5.556)+'%';document.getElementById('scale').style.left=(n===40?38.889:42)+'%'}setField(40)</script>
